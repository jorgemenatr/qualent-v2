<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.l{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.l div{border-radius:var(--radius-md);display:grid;place-items:center;padding:14px;height:170px}</style></head><body>
<div class="l"><div style="background:var(--bg-elevated);border:1px solid var(--border)"><img src="../assets/logo/picklellama-mark-wordmark.svg" style="height:140px"></div>
<div style="background:var(--bg-elevated);border:1px solid var(--border);gap:14px;grid-template-rows:auto auto"><img src="../assets/logo/wordmark.svg" style="width:180px"><img src="../assets/logo/picklellama-square.png" style="height:64px;border-radius:12px"></div>
<div style="background:var(--bg-brand)"><img src="../assets/logo/picklellama-square.png" style="height:120px;border-radius:16px"></div></div></body></html>
