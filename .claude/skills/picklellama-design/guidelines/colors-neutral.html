<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--pl-ink-900);color:#fff"><b>ink-900</b><span>#231F20</span></div><div class="sw" style="background:var(--pl-ink-800);color:#fff"><b>ink-800 · text</b><span>#3A3A38</span></div><div class="sw" style="background:var(--pl-ink-600);color:#fff"><b>ink-600 · muted</b><span>#5E5F5A</span></div><div class="sw" style="background:var(--pl-grey-500);color:#3A3A38"><b>grey-500 · llama</b><span>#B9BDBC</span></div><div class="sw" style="background:var(--pl-grey-300);color:#3A3A38"><b>grey-300 · border</b><span>#D3D6D2</span></div><div class="sw" style="background:var(--pl-paper-200);color:#3A3A38"><b>paper-200</b><span>#EAEDDF</span></div><div class="sw" style="background:var(--pl-paper-100);color:#3A3A38"><b>paper-100 · bg</b><span>#F4F5EE</span></div><div class="sw" style="background:#fff;color:#3A3A38"><b>white</b><span>#FFFFFF</span></div></div></body></html>
