<!-- @dsCard group="Spacing" viewport="700x170" subtitle="Soft label corners; shadows rare and warm-tinted" name="Radii & shadows" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.r{display:flex;gap:14px;align-items:center}.r div{width:80px;height:60px;background:var(--bg-elevated);border:1px solid var(--border);display:grid;place-items:center;font:11px var(--font-mono);color:var(--fg-muted)}</style></head><body>
<div class="r"><div style="border-radius:var(--radius-xs)">xs 3</div><div style="border-radius:var(--radius-sm)">sm 6</div><div style="border-radius:var(--radius-md)">md 10</div><div style="border-radius:var(--radius-lg)">lg 16</div><div style="border-radius:var(--radius-xl)">xl 24</div><div style="border-radius:var(--radius-pill);width:110px">pill</div></div>
<div class="r"><div style="border-radius:8px;box-shadow:var(--shadow-xs)">xs</div><div style="border-radius:8px;box-shadow:var(--shadow-sm)">sm</div><div style="border-radius:8px;box-shadow:var(--shadow-md)">md</div><div style="border-radius:8px;box-shadow:var(--shadow-lg)">lg</div><div style="border-radius:8px;border:var(--rule-dashed)">dashed rule</div></div></body></html>
