<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{width:1200px;height:627px;overflow:hidden;position:relative;background:var(--news-paper);color:var(--news-ink)}
.np{font:var(--type-nameplate);font-stretch:var(--news-stretch-plate);text-transform:uppercase;line-height:.9}
.h{font:800 1em/1.02 var(--font-news);font-stretch:75%;letter-spacing:-.01em;text-wrap:balance}
.k{font:var(--type-kicker);text-transform:uppercase;letter-spacing:.14em}
.k b{background:var(--news-ink);color:var(--news-paper);padding:8px 12px;font-weight:600}
.k i{font-style:normal;color:var(--fg-brand);margin-left:12px}
.dl{font:var(--type-dateline);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-muted)}
.dl b{color:var(--news-ink)}
.band{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:16px 48px;font:400 15px var(--font-news);text-transform:uppercase;letter-spacing:.08em;background:var(--news-ink);color:var(--news-paper)}
.strip{display:flex;justify-content:space-between;align-items:center;border-bottom:4px solid var(--news-ink);padding-bottom:12px}
.strip .np{font-size:44px}
.strip span{font:var(--type-dateline);text-transform:uppercase;letter-spacing:.1em;color:var(--fg-muted)}
</style></head><body>
<div style="position:absolute;inset:40px 48px 0;display:grid;grid-template-columns:1.15fr 1fr;gap:36px">
<div style="display:grid;grid-template-rows:auto 1fr;gap:20px"><div class="strip"><div class="np" style="font-size:38px">The Daily Llama</div><span>No. 3</span></div>
<div style="display:grid;gap:14px;align-content:start"><div class="k"><b>News</b><i>Logistics</i></div><div class="h" style="font-size:52px">Logistics Firm Hires Fourth Dispatcher to Manage Spreadsheet That Tracks the Other Three</div><div class="dl"><b>Hamilton, Ont.</b> — By Gazette staff</div></div></div>
<div style="background:var(--bg-brand-soft);position:relative;overflow:hidden;margin-bottom:54px"><div style="position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 98px,rgba(35,31,32,.12) 98px 100px),repeating-linear-gradient(0deg,transparent 0 32px,rgba(35,31,32,.12) 32px 34px)"></div><img src="../../assets/mascot/pose-standing.png" style="position:absolute;right:8%;bottom:0;height:94%"></div>
</div><div class="band" style="padding:14px 48px;font-size:13px"><span>All events are fictional. All spreadsheets are real.</span><span>Ask your boss about PickleLlama</span></div></body></html>
