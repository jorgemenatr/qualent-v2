<!-- @dsCard group="Spacing" viewport="700x150" subtitle="4px base · 4 8 12 16 24 32 48 64 96" name="Spacing scale" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.s{display:flex;align-items:flex-end;gap:10px}.s div{background:var(--bg-brand);border-radius:2px;width:22px}.s span{font:11px var(--font-mono);color:var(--fg-muted);display:block;text-align:center;margin-top:4px}</style></head><body>
<div class="s"><div style="height:var(--space-1)"></div><div style="height:var(--space-2)"></div><div style="height:var(--space-3)"></div><div style="height:var(--space-4)"></div><div style="height:var(--space-6)"></div><div style="height:var(--space-8)"></div><div style="height:var(--space-12)"></div><div style="height:var(--space-16)"></div><div style="height:var(--space-24)"></div></div>
<div class="s" style="gap:10px"><span style="width:22px">4</span><span style="width:22px">8</span><span style="width:22px">12</span><span style="width:22px">16</span><span style="width:22px">24</span><span style="width:22px">32</span><span style="width:22px">48</span><span style="width:22px">64</span><span style="width:22px">96</span></div></body></html>
