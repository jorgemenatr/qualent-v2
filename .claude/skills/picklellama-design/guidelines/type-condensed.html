<!-- @dsCard group="Type" viewport="700x170" subtitle="Eyebrows, stamps, label headings — always uppercase, tracked" name="Condensed caps (Oswald)" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
</style></head><body>
<div class="row" style="align-items:center;gap:20px">
<span class="cap" style="color:var(--fg-brand)">Diagnosis:</span>
<span style="font:var(--type-stamp);text-transform:uppercase;color:var(--fg)">Chronic spreadsheets.</span>
<span style="font:700 40px/1 var(--font-condensed);text-transform:uppercase;color:var(--fg-on-brand);background:var(--bg-brand);padding:8px 14px;border-radius:var(--radius-sm)">Free-range software</span>
</div>
<div class="row" style="gap:16px"><span style="font:600 14px/1 var(--font-condensed);text-transform:uppercase;letter-spacing:.06em;border:1.5px solid var(--danger);color:var(--danger);padding:6px 10px;border-radius:3px;transform:rotate(-3deg)">Treatable</span><span class="cap">Side effects may include:</span><span class="cap">Net wt. ∞ hrs of free time</span></div></body></html>
