<!-- @dsCard group="Brand" viewport="700x210" subtitle="Watermark halves, silhouette, lab-coat and standing poses" name="Mascot: the PickleLlama" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
.m{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:10px}.m div{border-radius:var(--radius-md);overflow:hidden;position:relative;height:170px;background:var(--bg-elevated);border:1px solid var(--border)}</style></head><body>
<div class="m">
<div style="background:var(--bg-brand-soft)"><img src="../assets/mascot/llama-left.svg" style="position:absolute;left:0;bottom:0;height:150px;opacity:.15"><img src="../assets/mascot/llama-right.svg" style="position:absolute;right:0;top:0;height:150px;opacity:.15"><span class="cap" style="position:absolute;inset:auto 0 12px 0;text-align:center">Hero watermark · 12–15% opacity</span></div>
<div><img src="../assets/mascot/llama-silhouette.svg" style="height:100%;width:100%;object-fit:contain;padding:12px"></div>
<div style="display:grid;place-items:center;padding:8px"><img src="../assets/mascot/pose-labcoat.png" style="height:100%;object-fit:contain"></div>
<div style="display:grid;place-items:center;padding:8px"><img src="../assets/mascot/pose-standing.png" style="height:100%;object-fit:contain"></div>
</div></body></html>
