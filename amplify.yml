version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - nvm use 20
            - npm ci --include=dev
            - npx prisma generate
        build:
          commands:
            # Create .env.production with runtime env vars for SSR
            - echo "DATABASE_URL=$DATABASE_URL" >> .env.production
            - echo "S3_BUCKET_NAME=$S3_BUCKET_NAME" >> .env.production
            - echo "S3_REGION=$S3_REGION" >> .env.production
            - echo "S3_ACCESS_KEY_ID=$S3_ACCESS_KEY_ID" >> .env.production
            - echo "S3_SECRET_ACCESS_KEY=$S3_SECRET_ACCESS_KEY" >> .env.production
            - echo "ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY" >> .env.production
            - echo "GOOGLE_AI_API_KEY=$GOOGLE_AI_API_KEY" >> .env.production
            - echo "GEMINI_FILE_SEARCH_STORE=$GEMINI_FILE_SEARCH_STORE" >> .env.production
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
    appRoot: web
