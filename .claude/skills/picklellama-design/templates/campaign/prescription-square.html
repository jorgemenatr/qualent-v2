<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css"><style>
body{width:1080px;height:1080px;overflow:hidden;position:relative;background:var(--bg)}
.eb{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-brand)}
.cap{font:700 var(--font-condensed);text-transform:uppercase}
</style></head><body>
<div style="position:absolute;inset:48px;background:var(--bg-elevated);border:2.5px solid var(--border-strong);border-radius:32px;padding:56px;display:grid;grid-template-rows:auto auto 1fr auto;gap:28px">
<div style="display:flex;align-items:center;gap:20px"><img src="../../assets/logo/picklellama-square.png" style="height:84px;border-radius:16px"><div><img src="../../assets/logo/wordmark.svg" style="height:34px"><div class="cap" style="font-size:22px;color:var(--fg);margin-top:6px">Prescription</div></div><span style="margin-left:auto;font:700 24px var(--font-condensed);text-transform:uppercase;color:var(--danger);border:2.5px solid var(--danger);padding:8px 16px;border-radius:4px;transform:rotate(-4deg)">Treatable</span></div>
<div style="border-top:1.5px dashed var(--border-strong);padding-top:24px;display:grid;gap:6px"><span class="eb" style="font-size:22px">Diagnosis:</span><div class="cap" style="font-size:84px;line-height:.95;color:var(--fg)">Chronic<br>spreadsheets.</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:28px;align-content:start">
<div style="display:grid;gap:8px"><span class="eb" style="font-size:20px">Prescription for:</span><img src="../../assets/logo/wordmark.svg" style="height:44px"><div style="font:700 44px/1 var(--font-sans);letter-spacing:-.02em">Automation</div><div style="background:var(--bg-brand-soft);border-radius:10px;padding:14px 18px;margin-top:8px"><span class="eb" style="font-size:16px">Class:</span><div style="font:600 20px var(--font-sans)">Workflow & process automation</div></div></div>
<div style="display:grid;gap:10px;align-content:start"><div style="background:var(--bg-brand);color:#fff;border-radius:8px;padding:10px 16px;font:700 20px var(--font-condensed);text-transform:uppercase;letter-spacing:.05em">Side effects may include:</div><div style="display:flex;gap:12px;align-items:center;font:600 24px var(--font-sans);padding:8px 0;border-bottom:1.5px dashed var(--border)"><span style="width:26px;height:26px;border:2.5px solid var(--primary);border-radius:5px;display:grid;place-items:center;color:var(--primary);font-size:18px">✓</span>Weekends</div><div style="display:flex;gap:12px;align-items:center;font:600 24px var(--font-sans);padding:8px 0;border-bottom:1.5px dashed var(--border)"><span style="width:26px;height:26px;border:2.5px solid var(--primary);border-radius:5px;display:grid;place-items:center;color:var(--primary);font-size:18px">✓</span>Leaving at 5</div><div style="display:flex;gap:12px;align-items:center;font:600 24px var(--font-sans);padding:8px 0;border-bottom:1.5px dashed var(--border)"><span style="width:26px;height:26px;border:2.5px solid var(--primary);border-radius:5px;display:grid;place-items:center;color:var(--primary);font-size:18px">✓</span>Sudden free time</div><div style="display:flex;gap:12px;align-items:center;font:600 24px var(--font-sans);padding:8px 0;border-bottom:1.5px dashed var(--border)"><span style="width:26px;height:26px;border:2.5px solid var(--primary);border-radius:5px;display:grid;place-items:center;color:var(--primary);font-size:18px">✓</span>Finishing by lunch</div></div></div>
<div style="border-top:2px solid var(--border-strong);padding-top:22px;display:flex;justify-content:space-between;align-items:center"><div class="cap" style="font-size:24px;color:var(--fg-brand)">Feel better. Work smarter.</div><div style="font:600 22px var(--font-sans);color:var(--fg-muted)">picklellama.studio</div></div>
</div></body></html>
