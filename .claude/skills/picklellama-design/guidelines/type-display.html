<!-- @dsCard group="Type" viewport="700x210" subtitle="Source Sans 3 Bold, tight leading, two-tone emphasis" name="Display & headings" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
</style></head><body>
<div style="font:var(--type-display);letter-spacing:var(--tracking-tight);color:var(--pl-lime-500)">Spreadsheets?<br><span style="color:var(--fg-brand)">There’s a cure.</span></div>
<div style="display:flex;gap:24px;align-items:baseline;flex-wrap:wrap"><span style="font:var(--type-h1);letter-spacing:var(--tracking-snug)">H1 · 52/1.15</span><span style="font:var(--type-h2)">H2 · 32/1.15</span><span style="font:var(--type-h3)">H3 · 20/1.3</span></div></body></html>
