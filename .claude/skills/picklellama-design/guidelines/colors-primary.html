<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>
body{padding:16px;background:var(--bg);display:flex;flex-direction:column;gap:12px;min-height:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.sw{flex:1 1 90px;min-width:90px;border-radius:var(--radius-sm);padding:10px;height:78px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid rgb(0 0 0/.06)}
.sw b{font:600 12px/1.2 var(--font-mono)}.sw span{font:400 11px/1.2 var(--font-mono);opacity:.75}
.cap{font:var(--type-eyebrow);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--fg-muted)}
</style></head><body><div class="row">
<div class="sw" style="background:var(--pl-pickle-800);color:#fff"><b>pickle-800</b><span>#4B5E33</span></div><div class="sw" style="background:var(--pl-pickle-700);color:#fff"><b>pickle-700</b><span>#5F7A2C</span></div><div class="sw" style="background:var(--pl-pickle-600);color:#fff"><b>pickle-600 · primary</b><span>#789338</span></div><div class="sw" style="background:var(--pl-pickle-500);color:#fff"><b>pickle-500</b><span>#909F4F</span></div><div class="sw" style="background:var(--pl-lime-500);color:#3A3A38"><b>lime-500</b><span>#C4D46A</span></div><div class="sw" style="background:var(--pl-lime-300);color:#3A3A38"><b>lime-300</b><span>#D8E48C</span></div><div class="sw" style="background:var(--pl-lime-100);color:#3A3A38"><b>lime-100</b><span>#EEF2DC</span></div></div></body></html>
